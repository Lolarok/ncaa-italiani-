name: NCAA Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 5,9 * * *'

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repository
        uses: actions/checkout@v4

      - name: Configurazione Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esecuzione Scraper Partite & Shot Charts
        run: |
          python scripts/sync_ncaa_italians.py

      - name: Commit e Push Dati Aggiornati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ncaa_italians_2027.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update post-partita NCAA [$(date +'%Y-%m-%d %H:%M')]" && git push)
